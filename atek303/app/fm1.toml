# ATEK303's build settings (fm1-base's tools/build.py: ./build.sh)
name = "ATEK303"               # the build's files: atek303.fwsc
id_prefix = "FM-1_330"         # package identity: dev FM-1_33000. No FM-1_303: es el de Smiley Face (las
                               # herramientas de M-VAVE leen solo los tres primeros dígitos)
usb_manufacturer = "Animatek"
usb_product = "ATEK303 FM-1"
ble = false                    # sin radio de momento
usb_audio_in = true            # el 303 se graba por USB
usb_audio_out = false
backup = true                  # copia y restauración de los presets por USB (tools/fm1_backup.py --magic DR64)
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/atek_voice.c", "dsp/acid_pattern.c", "dsp/fx.c", "dsp/drum_voice.c", "dsp/drum_pattern.c"]   # el motor, el generador y los efectos, y la batería, a -O2
# el sitio
title = "ATEK303"              # el nombre que ve la gente (si no, firmware.json saldría como «Animatek»)
tagline = "The ATEK303 acid voice and a TR drum track on the M-VAVE FM-1"
repo = "https://github.com/animatek/FM1-Animatek"
install = "https://thefirmwarehub.com/"
screenshot = "art/screen.png"
licence = "GPL-3.0-or-later"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Hügelton Instruments). The voice is ATEK303 by Animatek, on Open303 by Robin Schmidt."
author = "Animatek"
description = "ATEK303 turns the M-VAVE FM-1 into an acid groovebox: the ATEK303 engine (Open303) and its acid pattern generator, plus a drum track: eight analogue TR-808/909/707 voices (kick, snare, clap, hats, toms, cowbell/rim) with their own 64-step sequencer on the same clock. Press PLAY and a line and a beat play; generate, mutate and undo both patterns (LOCK mutates), edit the 303 in a piano roll and the drums in an 8x16 matrix, swing the drums, switch kits, add drive, chorus, delay and reverb. 14 WAVE oscillators, LEVEL/TUNE/DECAY per part, 8 factory presets in 32 slots (DR64), MIDI in and out."
tags = ["synth", "sequencer", "groovebox"]
