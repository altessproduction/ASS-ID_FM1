# ATEK303's build settings (fm1-base's tools/build.py: ./build.sh)
name = "ATEK303"               # the build's files: atek303.fwsc
id_prefix = "FM-1_330"         # package identity: dev FM-1_33000. No FM-1_303: es el de Smiley Face (las
                               # herramientas de M-VAVE leen solo los tres primeros dígitos)
usb_manufacturer = "Animatek"
usb_product = "ATEK303 FM-1"
ble = false                    # sin radio de momento
usb_audio_in = true            # el 303 se graba por USB
usb_audio_out = false
backup = true                  # copia y restauración de los presets por USB (tools/fm1_backup.py --magic AT64)
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/atek_voice.c", "dsp/acid_pattern.c", "dsp/fx.c"]   # el motor, el generador y los efectos, a -O2
# el sitio
title = "ATEK303"              # el nombre que ve la gente (si no, firmware.json saldría como «Animatek»)
tagline = "The ATEK303 acid voice on the M-VAVE FM-1"
repo = "https://github.com/animatek/FM1-Animatek"
install = "https://thefirmwarehub.com/"
screenshot = "art/screen.png"
licence = "GPL-3.0-or-later"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Hügelton Instruments). The voice is ATEK303 by Animatek, on Open303 by Robin Schmidt."
author = "Animatek"
description = "ATEK303 turns the M-VAVE FM-1 into an acid machine: the ATEK303 engine from VCV Rack (Open303 with a diode ladder and an oscillator modelled on the schematic) and its acid pattern generator. Press PLAY and a line plays; generate, mutate and undo patterns, edit the steps in a piano roll, and add drive, chorus or flanger, a synced ping-pong delay and a plate reverb. Up to 64 steps in four pages, 12 factory presets and 32 slots, an OPTIONS menu (OCT- + HOME: colour themes, MIDI channels, the sequencer's notes and clock out, the VCV module's fine tuning), MIDI in, out and clock."
tags = ["synth", "sequencer"]
